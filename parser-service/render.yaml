services:
  - type: web
    name: resume-parser-api
    env: python
    rootDir: parser-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: MODEL_NAME
        value: llama-3.1-8B-Instant
      - key: EMBEDDING_BACKEND
        value: hf
      - key: EMBEDDING_MODEL
        value: BAAI/bge-large-en
      - key: HF_API_TOKEN
        sync: false
